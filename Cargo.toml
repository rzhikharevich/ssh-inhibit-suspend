[package]
name = "ssh-inhibit-suspend"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["macros", "rt", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# If you're on nightly you can get a much smaller binary by using this recipe:
# RUSTFLAGS='-Zunstable-options -Cpanic=immediate-abort' cargo build -Z build-std=std,panic_abort
#   -Z build-std-features=optimize_for_size --profile=releasepkg --target=x86_64-unknown-linux-gnu
#
# See for more details: https://github.com/johnthagen/min-sized-rust
[profile.releasepkg]
inherits = "release"
lto = true
strip = true
opt-level = "z"
panic = "abort"
codegen-units = 1
